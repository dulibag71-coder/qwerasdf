<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Report - Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0f172a;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body class="text-white min-h-screen pb-20">

    <header class="p-5 flex items-center justify-between sticky top-0 bg-[#0f172a]/95 z-20">
        <div class="flex items-center gap-4">
            <a href="/club.html" class="p-2 hover:bg-white/10 rounded-full transition"><span
                    class="material-icons">arrow_back</span></a>
            <h1 class="text-xl font-bold">Weekly Report</h1>
        </div>
        <button onclick="downloadPDF()"
            class="text-emerald-400 hover:text-emerald-300 text-xs font-bold flex items-center gap-2 border border-emerald-500/30 px-3 py-1.5 rounded-full transition hover:bg-emerald-500/10">
            <span class="material-icons text-sm">download</span> SAVE PDF
        </button>
    </header>

    <main class="p-5 space-y-6">

        <!-- Stats Grid -->
        <div class="grid grid-cols-2 gap-4">
            <div class="glass-card p-5 rounded-2xl relative overflow-hidden">
                <div class="absolute -right-4 -top-4 w-16 h-16 bg-blue-500/20 rounded-full blur-xl"></div>
                <p class="text-gray-400 text-xs uppercase tracking-wide">Analysis</p>
                <p id="totalAnalysis" class="text-3xl font-bold mt-2 text-white">0</p>
                <p class="text-[10px] text-gray-500 mt-1">Videos Analyzed</p>
            </div>
            <div class="glass-card p-5 rounded-2xl relative overflow-hidden">
                <div class="absolute -right-4 -top-4 w-16 h-16 bg-red-500/20 rounded-full blur-xl"></div>
                <p class="text-gray-400 text-xs uppercase tracking-wide">Usage</p>
                <p id="creditsUsed" class="text-3xl font-bold mt-2 text-white">0</p>
                <p class="text-[10px] text-gray-500 mt-1">Credits Consumed</p>
            </div>
        </div>

        <!-- Chart Section -->
        <div class="glass-card p-5 rounded-2xl">
            <h3 class="font-bold mb-6 text-sm flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                Activity Trends
            </h3>
            <div class="relative h-48 w-full">
                <canvas id="activityChart"></canvas>
            </div>
        </div>

        <!-- Top Players -->
        <div class="glass-card p-6 rounded-2xl">
            <h3 class="font-bold mb-6 text-sm flex items-center gap-2 text-amber-500">
                <span class="material-icons text-base">emoji_events</span>
                Top Performers
            </h3>
            <div id="topList" class="space-y-4">
                <!-- Loading -->
            </div>
        </div>

    </main>

    <script src="/js/utils.js"></script>
    <script src="/js/clubReport.js"></script>
</body>

</html>
