<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Board - Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0f172a;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>

<body class="text-slate-300 min-h-screen pb-24">

    <header
        class="p-5 flex items-center gap-4 sticky top-0 bg-[#0f172a]/90 backdrop-blur-md z-10 border-b border-white/5">
        <a href="/club.html" class="p-2 hover:bg-white/10 rounded-full transition"><span
                class="material-icons">arrow_back</span></a>
        <h1 class="text-xl font-bold text-white">Community</h1>
    </header>

    <main class="p-4 space-y-6">

        <!-- Write Input -->
        <div class="glass-panel p-4 rounded-2xl relative">
            <h3 class="text-xs text-gray-500 mb-2 uppercase tracking-wide">New Post</h3>
            <textarea id="postContent" rows="3" placeholder="새로운 소식을 남겨보세요."
                class="w-full bg-black/30 rounded-xl p-4 text-white placeholder-gray-600 focus:outline-none focus:ring-1 focus:ring-green-500/50 transition resize-none"></textarea>

            <div class="flex justify-between items-center mt-3">
                <div class="relative">
                    <select id="postType"
                        class="bg-black/30 border border-white/10 text-xs rounded-lg px-3 py-2 text-gray-400 focus:outline-none appearance-none pr-8">
                        <option value="normal">일반글</option>
                        <option value="notice">📢 공지사항</option>
                    </select>
                    <span
                        class="material-icons absolute right-2 top-2 text-gray-500 text-xs pointer-events-none">arrow_drop_down</span>
                </div>
                <button onclick="writePost()"
                    class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2 rounded-lg text-sm font-bold shadow-lg shadow-emerald-900/50 transition transform active:scale-95">
                    Post
                </button>
            </div>
        </div>

        <!-- Feed -->
        <div id="postList" class="space-y-4">
            <!-- Loading -->
            <div class="text-center py-12">
                <div class="animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-emerald-500 mx-auto mb-2">
                </div>
                <p class="text-xs text-gray-500">불러오는 중...</p>
            </div>
        </div>

    </main>

    <script src="/js/utils.js"></script>
    <script src="/js/clubBoard.js"></script>
</body>

</html>
